<!DOCTYPE html>
<html lang="{{ curr_lang }}">

<head>
    <meta charset="UTF-8">
    <title>LEVEL EDITOR // ADMIN PANEL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a0a0a;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 40px;
        }

        a,
        button,
        select,
        textarea,
        input {
            font-family: inherit;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 22px;
            letter-spacing: 4px;
            color: #00ff88;
        }

        .button-link,
        .button-primary {
            display: inline-block;
            padding: 8px 16px;
            color: #00ff88;
            border: 1px solid #00ff88;
            text-decoration: none;
            background: transparent;
            cursor: pointer;
        }

        .card {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            color: #aaa;
            font-size: 13px;
        }

        select,
        textarea {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
        }

        textarea {
            min-height: 420px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 18px;
        }

        .form-row>* {
            flex: 1;
            min-width: 180px;
        }

        .notice {
            margin-top: 12px;
            color: #ffbb33;
            font-size: 12px;
        }

        .error {
            color: #ff4444;
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="top-bar">
        <h1>LEVEL CONTENT EDITOR</h1>
        <a class="button-link" href="{{ url_for('admin.admin_panel') }}">BACK TO ADMIN</a>
    </div>

    <div class="card">
        <form method="GET" action="{{ url_for('admin.admin_levels') }}">
            <div class="form-row">
                <label>
                    SELECT CATEGORY
                    <select name="category">
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if selected_category==cat %}selected{% endif %}>{{ cat.upper() }}
                        </option>
                        {% endfor %}
                    </select>
                </label>
                <button type="submit" class="button-primary">LOAD LEVELS</button>
            </div>
        </form>

        <form method="POST" action="{{ url_for('admin.admin_levels') }}">
            <input type="hidden" name="category" value="{{ selected_category }}" />
            <label>
                EDIT {{ selected_category.upper() }} LEVELS JSON
                <textarea name="levels_json" spellcheck="false">{{ levels_json }}</textarea>
            </label>
            <button type="submit" class="button-primary">SAVE LEVELS</button>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <div class="notice">Changes will update the level payload file immediately.</div>
        </form>
    </div>
</body>

</html>
